name: EAS Build (Android APK)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profilo eas.json da usare"
        required: false
        default: "preview"
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Link/create EAS project if needed
        run: eas init --non-interactive --force

      - name: Build on EAS
        run: eas build --platform android --profile "${{ github.event.inputs.profile || 'preview' }}" --non-interactive --wait

      - name: Add build summary
        if: always()
        run: |
          eas build:list --platform android --limit 1 --non-interactive --json > builds.json
          URL=$(jq -r '.[0].artifacts.buildUrl // empty' builds.json)
          STATUS=$(jq -r '.[0].status // "unknown"' builds.json)
          {
            echo "### Risultato build Android (${{ github.event.inputs.profile || 'preview' }})"
            echo ""
            echo "**Status:** $STATUS"
            echo ""
            if [ -n "$URL" ]; then
              echo "[Scarica APK]($URL)"
            else
              echo "Nessun link disponibile: controlla i log dello step precedente."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
